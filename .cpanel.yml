---
# cPanel deployment tasks, run by "Deploy HEAD Commit" in Git Version Control.
#
# The repository lives OUTSIDE the docroot; these tasks copy the application
# into it. That keeps .git unreachable from the web.
#
# DEPLOYPATH is set for the Rockbell host (cPanel user citytjgo). On a new host replace it with that
# host's /home/<user>/<docroot>/ from cPanel. It must end with a trailing slash.
#
# Deliberately NOT using --delete. It would make the docroot an exact mirror of
# the repo, which sounds tidy but would delete live's images/ and uploads/ the
# first time it ran against a path where those are excluded from the source.
# The cost of not using it is that files deleted in git linger on live; remove
# those by hand when it happens.
deployment:
  tasks:
    # Where this server deploys to is read from the SERVER, not from this file.
    #
    # It used to be hardcoded here as Rockbell's docroot. That is fine while one
    # client exists and dangerous the moment a second one does: both clients are
    # served from this same repository, so a pull on Goloviana would have brought
    # down Rockbell's path and the next deploy would have written one client's
    # code into the other client's website.
    #
    # ~/.rexlio_deploypath holds one line - that account's docroot. It lives
    # outside the repository, so it cannot travel between clients, and each
    # server states its own answer. Create it once per client:
    #
    #     echo /home/<cpanel-user>/<docroot> > ~/.rexlio_deploypath
    #
    # If it is missing, or names a folder that is not there, the deploy STOPS.
    # Refusing is the whole point: the alternative is deploying somewhere wrong
    # and finding out from the client.
    - export DEPLOYPATH="$(cat ~/.rexlio_deploypath 2>/dev/null | head -1 | tr -d '[:space:]')"
    - if [ -z "$DEPLOYPATH" ]; then echo "REFUSING TO DEPLOY: ~/.rexlio_deploypath is missing or empty on this server. Create it with: echo /home/<user>/<docroot> > ~/.rexlio_deploypath"; exit 1; fi
    - case "$DEPLOYPATH" in /home/*) ;; *) echo "REFUSING TO DEPLOY: ~/.rexlio_deploypath does not look like a docroot: $DEPLOYPATH"; exit 1;; esac
    - if [ ! -d "$DEPLOYPATH" ]; then echo "REFUSING TO DEPLOY: $DEPLOYPATH does not exist on this server"; exit 1; fi
    # every later task concatenates onto this, so the trailing slash is required
    - case "$DEPLOYPATH" in */) ;; *) export DEPLOYPATH="$DEPLOYPATH/";; esac
    - echo "Deploying to $DEPLOYPATH"
    - /bin/mkdir -p "$DEPLOYPATH"
    # Never copy: .git (source exposure), the local test harness (auth bypass),
    # live's own DB credentials, user uploads, runtime dirs, or the installer's
    # per-site activation files. assets/blueimp/REST_API*.json record the
    # installation_url (ROT13) of the machine that ran /install - copying this
    # machine's copies told live it was installed at http://localhost/rexlio/,
    # which is why every manual update needed /install re-run afterwards
    # (confirmed 2026-09-22).
    - >
      /usr/bin/rsync -a
      --exclude '.git'
      --exclude '.gitignore'
      --exclude 'pw.php'
      --exclude 'application/config/database.php'
      --exclude 'assets/blueimp/REST_API*.json'
      --exclude 'application/config/testing/'
      --exclude 'images/'
      --exclude 'uploads/'
      --exclude 'asset/excel/'
      --exclude 'application/logs/'
      --exclude 'application/cache/'
      --exclude 'db/'
      --exclude 'doc/'
      --exclude '_temp/'
      ./ "$DEPLOYPATH"
    # rsync -a with a trailing slash also copies the SOURCE directory's own mode onto
    # DEPLOYPATH. cPanel creates the repository folder 0700, which silently made the
    # docroot unreadable to the web server: every file 404'd while the folder still
    # listed (2026-09-22). Put the docroot back to 0755 on every deploy.
    - /bin/chmod 755 "$DEPLOYPATH"
    # Directories the app writes to at runtime must exist and be writable.
    - /bin/mkdir -p "$DEPLOYPATH"images "$DEPLOYPATH"uploads/category "$DEPLOYPATH"application/logs "$DEPLOYPATH"application/cache
    - /bin/chmod -R 755 "$DEPLOYPATH"images "$DEPLOYPATH"uploads "$DEPLOYPATH"application/logs "$DEPLOYPATH"application/cache
    # Build stamp: which commit live is running, readable at https://<site>/build.txt.
    # Used by people checking a deploy and by the hybrid sync tool (it refuses to
    # push data into an online copy running a different version than the local one).
    - /usr/bin/git rev-parse --short HEAD > "$DEPLOYPATH"build.txt
    - /bin/date -u +"deployed %Y-%m-%d %H:%M UTC" >> "$DEPLOYPATH"build.txt
